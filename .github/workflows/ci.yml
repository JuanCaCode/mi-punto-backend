name: CI

# Integracion continua del backend (FastAPI).
# Se ejecuta en cada Pull Request hacia main y en cada push a main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancela ejecuciones previas de la misma rama/PR si llega un nuevo commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias de desarrollo
        run: pip install -r requirements-dev.txt

      - name: Ejecutar ruff (lint)
        run: ruff check .

      - name: Verificar formato (ruff format)
        run: ruff format --check . || echo "::warning::Hay archivos sin formatear (no bloqueante)."

  test:
    name: Pruebas (unitarias + integracion + coverage)
    runs-on: ubuntu-latest

    # Base de datos PostGIS para las pruebas de integracion.
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: mi_punto_test
          POSTGRES_USER: mipunto
          POSTGRES_PASSWORD: mipunto
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U mipunto -d mi_punto_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Apunta el conftest a la base de datos del service container.
      TEST_DATABASE_URL: postgresql+psycopg://mipunto:mipunto@localhost:5433/mi_punto_test

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias de desarrollo
        run: pip install -r requirements-dev.txt

      - name: Ejecutar pruebas + coverage (gate 85%)
        run: python -m pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Publicar reporte de coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: coverage.xml
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest
    # El build solo tiene sentido si lint y pruebas pasan.
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias de produccion
        run: pip install -r requirements.txt

      - name: Compilar codigo (build)
        run: python -m compileall app

      - name: Verificar que la aplicacion arranca (smoke import)
        run: python -c "from app.main import app; print('App importada correctamente')"
